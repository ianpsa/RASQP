name: CI
on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: cargo doc --locked --no-deps
      - run: cargo package --locked
  native-laboratory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo build --locked --release
      - name: Full native Rust experiment suite in Linux seccomp
        run: target/release/rasqp-lab all results/ci/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-research-evidence
          path: results/ci/native
          if-no-files-found: error
  external-dataset-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/wildisley/requirements.lock.txt
      - run: cargo build --locked
      - name: QASM conversion, eligibility boundaries, and native versus Aer parity
        run: python -m pytest research/wildisley/test_dataset.py research/web_variants/test_variants.py research/false_positives/test_controls.py -q
      - name: Full evaluator contract on a synthetic fixture
        run: cargo test --locked --test external_dataset
  ibm-offline-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/ibm/requirements.lock.txt
      - run: cargo build --locked --release --bin rasqp
      - name: Offline calibrated noise, logical mappings, IBM primitive interoperability and QPU budget limits
        run: python -m pytest research/ibm/test_ibm.py -q
  # No IBM credentials, physical submissions or paid service calls run in CI.
  # Python reference parity is a local check documented in legacy/README.txt.
  # Its ignored source archive is intentionally unavailable in a fresh checkout.
