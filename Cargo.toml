[package]
name = "rasqp"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "Experimental assurance SDK for hybrid classical-quantum workflows"
readme = "README.txt"
publish = false
include = ["/rust/**", "/examples/**", "/tests/*.rs", "/tests/fixtures/*.json", "/Cargo.toml", "/Cargo.lock", "/README.txt", "/docs/*.txt", "/docs/*.json", "/legacy/README.txt"]

[lib]
path = "rust/lib.rs"

[[bin]]
name = "rasqp"
path = "rust/main.rs"

[[bin]]
name = "rasqp-lab"
path = "rust/lab_main.rs"

[[bin]]
name = "rasqp-release"
path = "rust/release_main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
num-complex = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
tar = "0.4"
flate2 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
